<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--az:#0A4C9A;--azs:#06306a;--azc:#DCEBFA;--lar:#E57F00;--cz:#5B6472;--czc:#E3E7EE;--tx:#14213D;--ok:#17703F;--er:#B42318}

.s{position:absolute;inset:0;padding:3vh 6vw;overflow:auto;background:#fff;opacity:0;visibility:hidden;transform:translateX(5vw);transition:opacity .5s,transform .5s,visibility 0s .5s}

h1{font-size:clamp(2.2rem,6.2vw,5rem);line-height:1.08;color:var(--azs)}

.card{background:#F6F8FC;border:2px solid var(--czc);border-radius:10px;padding:.8em 1em}
.tag{display:inline-block;font-size:.62em;font-weight:700;padding:.15em .6em;border-radius:99px;border:2px solid;margin:0 .3em .3em 0;vertical-align:middle}
.t-sim{color:#8a4b00;border-color:var(--lar);background:#FFF3E0}.t-plan{color:var(--az);border-color:var(--az)}
.t-real{color:#fff;background:var(--ok);border-color:var(--ok)}.t-pend{color:var(--cz);border-color:var(--cz);border-style:dashed}
.act{margin-top:1em;border-top:2px dashed var(--lar);padding-top:.6em}
.act>b{color:var(--lar)}
button,select{font:inherit;cursor:pointer}
.opts{display:flex;flex-wrap:wrap;gap:.5em;margin:.4em 0}
.opts button,.btn,.chip{background:#fff;border:2px solid var(--az);color:var(--az);border-radius:8px;padding:.4em .9em;min-height:44px}
.opts button:hover,.btn:hover,.chip:hover{background:var(--azc)}
.btn{background:var(--lar);border-color:var(--lar);color:#111;font-weight:700}.btn:hover{background:#ffa733}
.opts button.ok{background:var(--ok);border-color:var(--ok);color:#fff}.opts button.no{background:#FDE8E6;border-color:var(--er);color:var(--er)}
.chip[aria-pressed=true]{background:var(--az);color:#fff}
.fb{min-height:1.5em;margin-top:.3em;font-weight:700}.fb.ok{color:var(--ok)}.fb.no{color:var(--er)}.fb.nt{color:var(--az)}
svg{max-width:100%;height:auto;display:block}
.q{font-weight:700;margin-bottom:.2em}
:focus-visible{outline:3px solid var(--lar);outline-offset:2px}
.flow{stroke-dasharray:9 9;animation:dash 1s linear infinite;fill:none;stroke-width:4}
@keyframes dash{to{stroke-dashoffset:-18}}
.wf path{animation:pulse 1.6s infinite;opacity:.2}.wf path:nth-child(2){animation-delay:.3s}.wf path:nth-child(3){animation-delay:.6s}
@keyframes pulse{50%{opacity:1}}
.blk{fill:#F6F8FC;stroke:var(--az);stroke-width:3;transition:.3s}.blk.hl{fill:#FFE2B8;stroke:var(--lar)}
.fan{transform-origin:50px 50px}.on .fan,.fan.on{animation:spin .5s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.hs{position:absolute;width:34px;height:34px;border-radius:50%;border:3px solid #fff;background:var(--lar);color:#111;font-weight:700;transform:translate(-50%,-50%);box-shadow:0 0 0 0 #E57F0088;animation:ring 2s infinite}
.hs[aria-pressed=true]{background:var(--az);color:#fff;animation:none}@keyframes ring{70%{box-shadow:0 0 0 12px #E57F0000}}
.maq{position:relative;display:block;width:100%}.maq[hidden]{display:none}
.mi{width:100%;height:auto;display:block}
.solar-overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.maq .hs{z-index:2}
.maq .hs.solar-number{width:24px;height:24px;font-size:.7em;border-width:2px}
.gate{position:absolute;left:59.8%;top:60.8%;width:35%;height:30%;overflow:hidden;pointer-events:none}
.gdoor{width:100%;height:100%;transform:translateY(-103%)}.gdoor svg{width:100%;height:100%;display:block}
.gdoor.closing{animation:gclose 2.8s forwards}.gdoor.opening{animation:gopen 3.2s forwards}
.gbtn{position:absolute;left:59%;top:58%;width:36.5%;height:33%;background:transparent;border:0;padding:0;cursor:pointer;outline:none}.gbtn:focus-visible{outline:3px solid var(--lar)}
@keyframes gclose{0%{transform:translateY(-103%);animation-timing-function:cubic-bezier(.45,0,.55,1)}78%{transform:translateY(0);animation-timing-function:ease-out}86%{transform:translateY(-3%);animation-timing-function:ease-in}93%{transform:translateY(0);animation-timing-function:ease-out}97%{transform:translateY(-.8%)}100%{transform:translateY(0)}}
@keyframes gopen{0%{transform:translateY(0)}5%{transform:translateY(1.6%);animation-timing-function:cubic-bezier(.45,0,.55,1)}100%{transform:translateY(-103%)}}
@media(prefers-reduced-motion:reduce){.gdoor.closing{transform:none}}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:1em;margin-top:.6em}.mnav .chip{min-width:3em;font-size:1.35em;line-height:1}
.cover .cov{max-width:100%}
.cdoor{cursor:pointer;outline:none}.cdoor:focus-visible{outline:3px solid var(--lar)}.cdoorG{opacity:0;transition:opacity 0s .9s}.cpanel{transform-origin:94px 118px;transition:transform .9s cubic-bezier(.3,.1,.2,1)}#car.dopen .cdoorG{opacity:1;transition:none}#car.dopen .cpanel{transform:scaleX(.3) skewY(-8deg)}.drv{opacity:0;transform:translate(312px,156px) scale(.55)}.drv.out{animation:drvout 1.2s forwards}.drv.back{animation:drvback .6s forwards}.drvi{animation:drvidle 3.4s ease-in-out infinite}@keyframes drvidle{50%{transform:translateY(-1.2px)}}@keyframes drvout{0%{opacity:0;transform:translate(300px,146px) scale(.3)}35%{opacity:1;transform:translate(306px,150px) scale(.45)}65%{transform:translate(310px,152px) scale(.52)}100%{opacity:1;transform:translate(312px,156px) scale(.55)}}@keyframes drvback{0%{opacity:1;transform:translate(312px,156px) scale(.55)}100%{opacity:0;transform:translate(300px,146px) scale(.3)}}
.hwrap{position:relative;max-width:520px;flex:1 1 320px}.clist{flex:1.35 1 360px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5em}.cp{display:flex;gap:.5em;align-items:center;text-align:left;background:#fff;border:2px solid var(--czc);border-radius:10px;padding:.35em .5em;color:var(--tx);min-height:92px}.cp:hover{border-color:var(--az)}.cp[aria-pressed=true]{border-color:var(--lar);background:#FFF3E0}.ci{flex:0 0 58px}.ci svg{width:58px;height:58px}.ct b{display:block;font-size:.92em;line-height:1.2}.ct small{display:block;font-size:.78em;color:var(--cz);line-height:1.25;margin-top:.15em}@media(max-width:700px){.clist{grid-template-columns:1fr}}
#roupa{transition:transform 1.4s ease}.rain line{opacity:0}.raining .rain line{opacity:.6;animation:fall linear infinite}@keyframes fall{from{transform:translate(0,0)}to{transform:translate(-30px,235px)}}#sky{fill:url(#skyg)}#skyrain{fill:#BCC8D8;opacity:0;transition:opacity 1.2s}.raining #skyrain{opacity:1}#sun,#clouds,#plane{transition:opacity 1.2s}.raining #sun,.raining #clouds,.raining #plane{opacity:0}.drift{animation:drift linear infinite}@keyframes drift{from{transform:translateX(-130px)}to{transform:translateX(540px)}}.fly{animation:fly 52s linear infinite}@keyframes fly{from{transform:translate(-100px,11px)}to{transform:translate(500px,4px)}}.srays{animation:sunp 6s ease-in-out infinite}.sunp{animation:sunp 4s ease-in-out infinite}@keyframes sunp{50%{opacity:.75}}#bolt,#flash{transition:opacity .06s}#cloud{opacity:0;transition:opacity 1.2s}.raining #cloud{opacity:1}.spl ellipse{opacity:0;transform-box:fill-box;transform-origin:center}.raining .spl ellipse{animation:rip .8s ease-out infinite}@keyframes rip{from{opacity:.8;transform:scale(.1)}to{opacity:0;transform:scale(1)}}
#car{transition:transform 2s ease}#gwall{transition:fill .8s}.lit #gwall{fill:#F5E3BA}#lrays{opacity:0;transition:opacity .8s}.lit #lrays{opacity:1}.ray{animation:shim 2.8s ease-in-out infinite}@keyframes shim{50%{opacity:.8}}#lhalo{opacity:0;transition:opacity .6s}.lit #lhalo{opacity:.65}#lbulb{fill:#8a8f99;transition:fill .6s}.lit #lbulb{fill:#FFF6C8}.wh{transform-box:fill-box;transform-origin:center}.moving .wh{animation:spin .45s linear infinite}.beam{opacity:0;transition:opacity .3s}.moving .beam{opacity:.4}
.phone{width:min(300px,100%);margin:auto;border:8px solid #1c2a45;border-radius:28px;background:#fff;padding:.6em;font-size:.8rem;position:relative}
.phone .c{border:2px solid var(--czc);border-radius:8px;padding:.4em .6em;margin:.3em 0;display:flex;justify-content:space-between;gap:.4em;align-items:center}
.sw{min-height:36px;padding:.1em .6em;border:2px solid var(--az);border-radius:99px;background:#fff;font-size:.9em}.sw[aria-pressed=true]{background:var(--az);color:#fff}
footer{position:fixed;left:0;right:0;bottom:0;height:64px;background:#fff;border-top:3px solid var(--az);display:flex;align-items:center;gap:1vw;padding:0 2vw;z-index:5;font-size:.75rem}
footer .tm{flex:1;color:var(--cz);min-width:0}
.logo{height:40px;display:inline-flex}.lg{border:2px dashed var(--cz);color:var(--cz);padding:0 .5em;font-size:.7rem;line-height:1.1;text-align:center;display:flex;flex-direction:column;justify-content:center;border-radius:4px}
.nv{min-width:44px;min-height:44px;border-radius:50%;border:2px solid var(--az);background:var(--az);color:#fff;font-size:1.1rem}.nv:disabled{opacity:.35}
#prog{position:fixed;left:0;top:0;height:6px;background:var(--lar);transition:width .5s;z-index:6}
.edge{display:none;position:fixed;top:0;bottom:64px;width:6vw;z-index:4}@media(pointer:coarse){.edge{display:block}}
.cover{display:grid;grid-template-columns:1.1fr .9fr;gap:2vw;align-items:center;min-height:100%}@media(max-width:800px){.cover{grid-template-columns:1fr}}
.gr3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1vw}.ar{display:flex;justify-content:space-between;align-items:center;gap:.5em;padding:.55em 0;border-top:1px solid var(--czc);font-size:1.02em;line-height:1.25}.card h3+.ar{border-top:0}.gr3 .card h3{font-size:1.2em;margin-bottom:.4em}.kb{display:inline-flex;width:1.7em;height:1.7em;border-radius:50%;align-items:center;justify-content:center;font-size:.8em;font-weight:700;font-style:normal;color:#fff;margin-left:.25em;vertical-align:middle}.kE{background:#0A4C9A}.kP{background:#E57F00;color:#111}.kR{background:#0E7C86}.kI{background:#5B6472}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1vw}
.chips{display:flex;flex-wrap:wrap;gap:.5em}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Ajustes: slides centralizados e fonte maior ===== */
.s.c{display:flex;flex-direction:column;align-items:center;text-align:center;font-size:clamp(18px,1.95vw,32px)}
.s.c>:first-child{margin-top:auto}.s.c>:last-child{margin-bottom:auto}
.s.c h2{border-left:0;padding:0 .3em .15em;border-bottom:.14em solid var(--lar);margin-bottom:.8em;font-size:clamp(1.8rem,3.8vw,3.2rem)}
.s.c .row{width:100%;justify-content:center;align-items:center}
.s.c p{margin-left:auto;margin-right:auto}
.s.c ul{display:inline-block;text-align:left}.s.c li{margin:.15em 0}
.s.c .card{text-align:left}
.logos{display:flex;gap:2.5vw;align-items:center;height:clamp(64px,12vh,120px);margin-bottom:1.1em}.logos .logo{height:100%}
.mundo{font-size:1.9em;font-weight:700;color:var(--lar);margin-top:.5em;line-height:1.2}
/* slide 5: lista que cresce */
.s.c .hwrap{max-width:min(640px,46vw)}.s.c .hs{width:38px;height:38px;font-size:.95em}
.pcol{flex:1.2 1 380px;display:flex;flex-direction:column;align-items:flex-start}
.plist{width:100%;max-height:60vh;overflow:auto;display:flex;flex-direction:column;gap:.5em;text-align:left;padding:.2em}
.pi{display:flex;gap:.7em;align-items:center;background:#F6F8FC;border:2px solid var(--czc);border-radius:10px;padding:.4em .7em}
.pi.new{border-color:var(--lar);background:#FFF8EC}
.pi h3{font-size:1em;margin:0 0 .1em}.pi p{font-size:.8em;line-height:1.35;max-width:none;margin:0}
.pic{flex:0 0 3em;height:3em}.pic svg{width:100%;height:100%}
.ph{color:var(--cz);text-align:center;padding:1em;border:2px dashed var(--czc);border-radius:10px;margin:0}
/* slide 7: ponte com o ESP32 */
.s.dense{font-size:clamp(15px,1.4vw,24px)}.s.dense h2{margin-bottom:.4em}
.conn{width:100%;display:flex;flex-wrap:wrap;gap:.6em 1em;align-items:center;justify-content:center;margin-bottom:.7em}
.conn input[type=text]{font:inherit;border:2px solid var(--az);border-radius:8px;padding:.3em .6em;min-height:44px;width:11em}
.conn a.btn{text-decoration:none;display:inline-flex;align-items:center}
.pill{display:inline-flex;align-items:center;font-weight:700;padding:.2em .8em;border-radius:99px;border:2px solid var(--cz);color:var(--cz)}
.pill.on{border-color:var(--ok);color:var(--ok)}.pill.off{border-color:var(--er);color:var(--er)}
.alarm{display:none;width:100%;margin-bottom:.6em;padding:.4em .8em;border:3px solid var(--er);background:#FDE8E6;color:var(--er);font-weight:700;border-radius:8px}
.alarm.on{display:block;animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:.5}}
.ctl{width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:1vw;text-align:left;align-items:start}
.ctl h3{margin:.3em 0 .3em}.ctl h3:first-child{margin-top:0}
.tg,.sens{display:flex;justify-content:space-between;align-items:center;gap:.5em;padding:.25em 0;border-top:1px solid var(--czc)}
.tgb{min-height:44px;min-width:8.5em;border:2px solid var(--az);border-radius:99px;background:#fff;color:var(--az);font-weight:700;padding:.1em .8em}
.tgb[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
.ctl button:disabled,.ctl input:disabled,.btn:disabled{opacity:.45;cursor:not-allowed}
.rgbrow{display:grid;grid-template-columns:1.2em 1fr 2.6em;gap:.4em;align-items:center}.rgbrow input{width:100%}.rgbrow output{text-align:right}
.swatch{height:1.5em;border-radius:6px;border:2px solid var(--czc);background:#000;margin:.2em 0 .3em}
details.help{width:100%;margin-top:.6em;text-align:left;font-size:.75em;color:var(--cz)}details.help summary{cursor:pointer;text-align:center}
details.help code{font-family:Consolas,monospace;color:var(--tx)}details.help li{max-width:none;margin:.2em 0}
/* capa: encolhe com a altura da tela para nada ficar cortado */
.cover h1{font-size:clamp(1.8rem,min(6.2vw,9.5vh),5rem)}
.cover .logos{height:clamp(44px,10vh,120px);margin-bottom:.8em}
.cover .sub{font-size:min(1.5em,3.6vh)}.cover .mundo{font-size:min(1.9em,4.6vh);margin-top:.4em}
.cover .integ{margin-top:.6em;font-size:min(1em,2.8vh)}

@media(max-width:700px){.mq{grid-template-columns:1fr}}

.mq-ph{display:flex;flex-direction:column;gap:.2em;text-align:center;align-items:center}.mq-ph b{font-size:1.1em;color:var(--az)}.mq-ph small{font-size:.75em}

  <div class="esp7-intro">

/* ===== MOTOR ===== */
const deck=document.getElementById('deck');let cur=0;
deck.innerHTML=S.map((h,i)=>`<section class="s" aria-label="Slide ${i+1}">${h}</section>`).join('');
const slides=[...deck.children];slides.forEach((x,i)=>{if(i>=1)x.classList.add('c')});slides[6].classList.add('dense');
const $=id=>document.getElementById(id);
document.getElementById('fl-senai').innerHTML=logo('senai');
function go(n){n=Math.max(0,Math.min(S.length-1,n));if(n===cur&&slides[n].classList.contains('on'))return;
 const old=slides[cur];if(old.classList.contains('on')){old.classList.remove('on');old.classList.add('out');setTimeout(()=>old.classList.remove('out'),500)}
 cur=n;slides[n].classList.add('on');slides[n].scrollTop=0;
 document.getElementById('num').textContent=`${n+1} / ${S.length}`;document.getElementById('prog').style.width=((n+1)/S.length*100)+'%';
 document.getElementById('bp').disabled=n===0;document.getElementById('bn').disabled=n===S.length-1;history.replaceState(null,'','#'+(n+1))}
const nx=()=>go(cur+1),pv=()=>go(cur-1);
bn.onclick=nx;bp.onclick=pv;eR.onclick=nx;eL.onclick=pv;
addEventListener('keydown',e=>{if(e.target.classList&&(e.target.classList.contains('gbtn')||e.target.classList.contains('cdoor')))return;const t=e.target.tagName;if(t==='INPUT'||t==='SELECT'||t==='TEXTAREA')return;
 if(e.key==='ArrowRight'||e.key==='PageDown'){nx()}else if(e.key==='ArrowLeft'||e.key==='PageUp'){pv()}
 else if(e.key===' '&&t!=='BUTTON'){e.preventDefault();nx()}else if(e.key==='Home')go(0);else if(e.key==='End')go(S.length-1)});


/* Slide 5: seleção dos componentes e navegação entre as duas maquetes */
const opened=new Set();
let maqAt=0;
function renderParts(){
 const selected=modelParts[maqAt].filter((q,i)=>opened.has(`${maqAt}-${i}`)).sort((a,b)=>a.n-b.n);
 plist.innerHTML=selected.length?'': '<p class="ph">Selecione um número na casa para ver a função do componente.</p>';
 selected.forEach(q=>{const i=modelParts[maqAt].indexOf(q);const it=document.createElement('div');it.className='pi';it.id=`pi${maqAt}-${i}`;it.innerHTML=`<span class="pic">${ICONS[q.icon]}</span><div><h3>${q.n}. ${q.name}</h3><p>${q.desc}</p></div>`;plist.appendChild(it)});
}
hw.onclick=e=>{const b=e.target.closest('.hs');if(!b)return;const k=+b.dataset.p,m=+b.dataset.m,q=modelParts[m][k];b.setAttribute('aria-pressed','true');opened.add(`${m}-${k}`);if(m===maqAt)renderParts()};
function showMaquette(next){maqAt=next;document.querySelectorAll('#hw .maq').forEach(m=>m.hidden=+m.dataset.m!==maqAt);renderParts()}
prevM.onclick=()=>showMaquette(1-maqAt);nextM.onclick=()=>showMaquette(1-maqAt);
/* Slide 7: direciona a interface web do ESP32 automaticamente para uma nova aba */
const espForm=$('espConnect'),espInput=$('espUrl'),espStatus=$('espStatus');
function setEspStatus(message){espStatus.textContent=message;}
function normalizeEspUrl(value){
 let raw=value.trim();
 if(!raw)throw new Error('Digite o endereço IP ou a URL da interface do ESP32.');
 if(!/^https?:\/\//i.test(raw))raw='http://'+raw;
 let parsed;
 try{parsed=new URL(raw)}catch(e){throw new Error('Endereço inválido. Confira o IP, a porta e o caminho.');}
 if(!['http:','https:'].includes(parsed.protocol)||parsed.username||parsed.password)throw new Error('Use um endereço HTTP ou HTTPS válido, sem usuário ou senha.');
 return parsed.href;
}
espForm.addEventListener('submit',e=>{
 e.preventDefault();
 try{
  const url=normalizeEspUrl(espInput.value);
  const painelTab=window.open(url,'_blank');
  if(painelTab){painelTab.opener=null;setEspStatus('Painel direcionado para uma nova aba.');}
  else{setEspStatus('O navegador bloqueou a nova aba. Permita pop-ups para esta apresentação e tente novamente.');}
 }catch(err){setEspStatus(err.message);}
});

let ac;function initAudio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
/* Easter egg: portão da garagem (casas dos slides 1 e 5) */
let gClosed=false,gBusy=false;
function doorSound(close){try{initAudio();const t0=ac.currentTime,d=close?2.4:2.9,n=Math.floor(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);
 for(let i=0;i<n;i++){const t=i/ac.sampleRate;a[i]=(Math.random()*2-1)*(.6+.4*Math.sin(t*38))*Math.min(1,t*6)*Math.min(1,(d-t)*3)}
 const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=260;f.Q.value=.8;const g=ac.createGain();g.gain.value=.22;s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t0);
 if(close){const o=ac.createOscillator(),og=ac.createGain();o.type='sine';o.frequency.setValueAtTime(90,t0+2.18);o.frequency.exponentialRampToValueAtTime(40,t0+2.55);og.gain.setValueAtTime(.0001,t0);og.gain.setValueAtTime(.6,t0+2.18);og.gain.exponentialRampToValueAtTime(.001,t0+2.7);o.connect(og);og.connect(ac.destination);o.start(t0);o.stop(t0+2.8)}}catch(e){}}
function toggleGate(){if(gBusy)return;gBusy=true;gClosed=!gClosed;
 document.querySelectorAll('.gdoor').forEach(d=>{d.classList.remove('closing','opening');void d.getBoundingClientRect();d.classList.add(gClosed?'closing':'opening')});
 doorSound(gClosed);setTimeout(()=>gBusy=false,gClosed?2800:3200)}
deck.addEventListener('click',e=>{if(e.target.closest('.gbtn'))toggleGate()});

go(Math.max(0,(parseInt(location.hash.slice(1))||1)-1));
</script>
